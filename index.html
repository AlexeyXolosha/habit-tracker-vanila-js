<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="./src/styles/index.css">
</head>

<body>

    <main class="content">

        <section class="section tracker">
            <div class="container">
                <h2 class="tracker__title">Ваши привычки</h2>

                <div class="tracker__body">
                    <div class="tracker-head">
                        <h3 class="tracker-head__title">Сегодня</h3>
                        <p class="tracker-head__count">Выполнено</p>
                    </div>

                    <ul class="tracker-list">
                        <li class="tracker-list__item"></li>
                    </ul>

                    <div class="trackek-add">
                        <button>＋ Добавить привычку</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div class="tracker-modal">
        <div class="tracker-modal__wrapper">
                
        </div>
    </div>

</body>

</html>
