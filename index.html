<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="./src/styles/index.css">
</head>

<body>

    <main class="content">

        <section class="section tracker">
            <div class="container">
                <h2 class="tracker__title">Ваши привычки</h2>

                <div class="tracker__body">
                    <div class="tracker-head">
                        <h3 class="tracker-head__title">Сегодня</h3>
                        <p class="tracker-head__count">Выполнено</p>
                    </div>

                    <ul class="tracker-list">
                    </ul>

                    <div class="tracker-add">
                        <button data-open-modal="add-habit" type="button" aria-label="Добавить привычку">＋ Добавить
                            привычку</button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <div role="dialog" aria-modal="true" aria-labelledby="add-habit-title" data-modal="add-habit" class="tracker-modal">
        <div class="tracker-modal__wrapper">

            <div class="tracker-modal__head">
                <button data-close-modal class="button tracker-modal__close" type="button" aria-label="Закрыть">
                    <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" class="lucide lucide-chevron-left preview-icon">
                        <path d="m15 18-6-6 6-6" />
                    </svg>
                </button>
                <div class="tracker-modal__step">ШАГ 1 ИЗ 1</div>
            </div>

            <div class="tracker-modal__body">
                <h2 id="add-habit-title" class="tracker-modal__title">Новая привычка</h2>
                <p class="tracker-modal__intro">Начни с небольшого действия — регулярность важнее идеала.</p>

                <form data-form="add-habit" class="tracker-form">
                    <div class="tracker-form__group field">
                        <label class="field__label" for="habit-name">Какую привычку добавим ?</label>
                        <input class="field__input" type="text" placeholder="Например, читать каждый день"
                            id="habit-name" name="habit_name" required>
                    </div>
                </form>

            </div>
        </div>
    </div>


    <script type="module">
        import { initModal } from './src/js/components/modal.js';
        initModal()
    </script>
</body>

</html>
